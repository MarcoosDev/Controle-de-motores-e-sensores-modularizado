[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

board_build.arduino.upstream_packages = no

monitor_port = COM5
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4